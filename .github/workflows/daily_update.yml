name: Schemalagd Europeisk Prisuppdatering

on:
  schedule:
    # 04:30 UTC motsvarar 05:30 svensk normaltid (CET) / 06:30 sommartid (CEST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Gör det möjligt att starta manuellt från GitHub

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v3

      - name: Konfigurera Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kör uppdateringsskript
        run: python update_data.py

      - name: Spara uppdaterad databas till GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add stock_database.db
          git commit -m "Auto-uppdatering av europeiska aktiekurser [skip ci]" || exit 0
          git push
