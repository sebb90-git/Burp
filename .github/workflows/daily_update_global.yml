name: Daily Stock Data Update

on:
  schedule:
    # Körs varje morgon kl 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Gör att du även kan starta den manuellt på GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-setup@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: |
          python update_global_data.py

      - name: Commit and Push updated database files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add stock_database_*.db
          git commit -m "Auto-update stock database files" || echo "Inga ändringar att spara"
          git push
