name: Schemalagd Utomeuropeisk Prisuppdatering

on:
  schedule:
    # 07:00 UTC motsvarar kl 09:00 svensk sommartid (CEST) / 08:00 normaltid (CET)
    - cron: '0 7 * * *'
  workflow_dispatch: # Gör att du kan starta det manuellt när som helst från GitHub

jobs:
  update-global-db:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v3

      - name: Konfigurera Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kör globalt uppdateringsskript
        run: python update_global_data.py

      - name: Spara uppdaterad databas till GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add stock_database.db
          git commit -m "Auto-uppdatering av utomeuropeiska aktiekurser [skip ci]" || exit 0
          git push
